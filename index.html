<style>
:root{
  --orange:#E14E12; --green:#4C9033; --yellow:#F6D400; --blue:#9ED3F3;
  --ink:#222222; --muted:#5A5A5A; --line:#E3E3E3; --soft:#F7F7F7; --bg:#FFFFFF;
  --radius:12px; --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Heebo',system-ui,sans-serif;font-size:16px;line-height:1.55}
body{direction:rtl;text-align:right;min-height:100vh}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--ink)}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--bg)}
.top-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:16px;min-height:68px}
.top .who{display:flex;align-items:center;gap:10px;font-weight:600}
.top .who .av{width:34px;height:34px;border-radius:50%;background:var(--yellow);display:grid;place-items:center;font-weight:800}
.top .logo{margin-inline-start:auto;display:block;height:46px}
.top .logo img{height:46px;width:auto;display:block}
.strip{display:grid;grid-template-columns:repeat(4,1fr);height:4px}
.strip i:nth-child(1){background:var(--orange)} .strip i:nth-child(2){background:var(--yellow)}
.strip i:nth-child(3){background:var(--green)} .strip i:nth-child(4){background:var(--blue)}
.demo-bar{background:var(--soft);border-bottom:1px solid var(--line);font-size:14px;color:var(--muted);text-align:center;padding:6px 16px}
.demo-bar a{font-weight:600;margin-inline:6px}

/* ---------- layout ---------- */
.wrap{max-width:760px;margin:0 auto;padding:24px 16px 120px}
.wrap.wide{max-width:1180px}
h1{font-size:28px;font-weight:800;margin:6px 0 4px;line-height:1.25}
h2{font-size:19px;font-weight:700;margin:0 0 14px}
.lead{color:var(--muted);margin:0 0 22px}
.card{border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:16px;background:var(--bg)}
.card h2 .num{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;margin-inline-end:8px;font-size:18.7px;font-weight:800}
.card:nth-of-type(1) h2 .num{background:var(--yellow)}
.card:nth-of-type(2) h2 .num{background:var(--blue)}
.card:nth-of-type(3) h2 .num{background:var(--green);color:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px 16px}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}

/* ---------- fields ---------- */
.field label{display:block;font-weight:600;margin-bottom:6px}
.field .req{color:var(--orange);font-weight:800}
.field input,.search input,.textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;background:var(--bg);transition:border-color .15s var(--ease)}
.field input:hover{border-color:#cfcfcf}
.field input:focus,.search input:focus,.textarea:focus{border-color:var(--ink);outline:none}
.field input[dir=ltr]{text-align:left}
.field input[dir=ltr]::placeholder{text-align:left}
.field.bad input{border-color:var(--orange)}
.field .hint{font-size:13px;color:var(--muted);margin-top:4px}
.field .err{font-size:14px;color:var(--orange);font-weight:600;margin-top:4px;min-height:0}
.err:empty{display:none}
.fix{background:none;border:0;padding:0;text-decoration:underline;cursor:pointer;font-weight:700;color:var(--ink)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:10px;border:1.5px solid var(--ink);background:var(--bg);font-weight:700;cursor:pointer;text-decoration:none;transition:background-color .15s var(--ease),border-color .15s var(--ease);white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--orange);border-color:var(--orange);color:#fff;font-size:18.7px;min-height:50px}
.btn.primary:hover{background:var(--orange);border-color:var(--ink)}
.btn.small{min-height:38px;padding:0 14px;font-size:15px}
.btn.ghost{border-color:transparent;background:transparent;text-decoration:underline}
.btn.ghost:hover{background:var(--soft)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.busy{pointer-events:none;opacity:.7}
.btn.busy::after{content:"";width:16px;height:16px;border:2.5px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.linkbtn{background:none;border:0;padding:4px 2px;cursor:pointer;font-weight:600;text-decoration:underline;color:var(--muted)}
.linkbtn:hover{color:var(--ink)}

/* ---------- documents (referrer) ---------- */
.doc{border:1.5px dashed var(--line);border-radius:10px;padding:14px;margin-bottom:10px;transition:border-color .15s var(--ease),background-color .15s var(--ease)}
.doc.has{border-style:solid;border-color:var(--green)}
.doc.drag{border-color:var(--ink);background:var(--soft)}
.doc.bad{border-color:var(--orange)}
.doc-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.doc-name{font-weight:700;font-size:17px}
.tag{font-size:13px;font-weight:600;border-radius:999px;padding:2px 10px;border:1px solid var(--line);color:var(--muted)}
.tag.req{border-color:var(--orange);color:var(--ink)}
.doc-state{margin-inline-start:auto;font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px}
.ok-dot{width:20px;height:20px;border-radius:50%;background:var(--green);display:inline-grid;place-items:center}
.ok-dot svg{width:12px;height:12px}
.doc-files{list-style:none;margin:10px 0 0;padding:0}
.doc-files li{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:15px}
.doc-files li:first-child{border-top:0}
.doc-files .fname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60%}
.doc-files .fmeta{color:var(--muted);font-size:13px}
.doc-files .x{margin-inline-start:auto}
.doc-actions{display:flex;align-items:center;gap:12px;margin-top:10px;flex-wrap:wrap}
.drop-hint{font-size:13px;color:var(--muted)}
@media (hover:none){.drop-hint{display:none}}
.doc-err{color:var(--orange);font-weight:600;font-size:14px;margin-top:6px}
.doc-err:empty{display:none}

.actions-bar{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:14px 16px;margin:0 -16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;z-index:5}
.actions-bar .missing{font-size:14px;color:var(--muted);flex-basis:100%}
.note{border-radius:10px;padding:12px 14px;margin-bottom:16px;font-weight:500}
.note.info{background:var(--blue)}
.note.wait{background:var(--yellow)}
.note.plain{background:var(--soft)}

/* ---------- end states ---------- */
.end{text-align:center;padding:40px 8px}
.end .big{width:72px;height:72px;border-radius:20px;margin:0 auto 18px;display:grid;place-items:center;background:var(--green)}
.end .big svg{width:36px;height:36px}
.end p{max-width:520px;margin:8px auto;color:var(--muted)}
.copyrow{display:flex;gap:8px;max-width:560px;margin:18px auto 0}
.copyrow input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;direction:ltr;text-align:left;font-size:14px;background:var(--soft)}

/* ---------- dashboard ---------- */
.dash-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.dash-head h1{margin:0}
.share{margin-inline-start:auto;display:flex;gap:8px;flex-wrap:wrap}
.folderline{font-size:14px;color:var(--muted);margin:-8px 0 18px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.folderline b{color:var(--ink)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 14px;font-weight:600;cursor:pointer;font-size:15px;min-height:38px}
.chip:hover{border-color:#cfcfcf}
.chip[aria-pressed=true]{border-color:var(--ink);background:var(--ink);color:#fff}
.chip .n{font-weight:400;margin-inline-start:4px;opacity:.8}
.subchips{display:flex;gap:8px;flex-wrap:wrap;margin:-4px 0 14px}
.chip.sub{font-size:14px;min-height:32px;padding:3px 12px}
.search{margin-inline-start:auto;min-width:240px}
@media (max-width:700px){.search{min-width:100%}}

.list{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.lrow{display:grid;grid-template-columns:minmax(170px,1.4fr) minmax(130px,1fr) 150px 120px 150px 90px;gap:12px;align-items:center;padding:14px 16px;border-top:1px solid var(--line);width:100%;background:var(--bg);border-inline:0;border-bottom:0;text-align:right;cursor:pointer;transition:background-color .15s var(--ease)}
.lrow:hover{background:var(--soft)}
.lrow.head{cursor:default;font-size:13px;font-weight:600;color:var(--muted);border-top:0;padding-block:10px;background:var(--soft)}
.lrow.flash{animation:flash 1.6s var(--ease)}
@keyframes flash{0%,40%{background:var(--yellow)}100%{background:var(--bg)}}
.pname{font-weight:700;font-size:16px}
.sub{font-size:13px;color:var(--muted)}
.pills{display:flex;gap:4px;align-items:center}
.pill{width:20px;height:20px;border-radius:5px;border:1.5px solid #bdbdbd;display:grid;place-items:center}
.pill.on{background:var(--green);border-color:var(--green)}
.pill.opt{border-style:dashed;border-color:#cfcfcf}
.pill.opt.on{border-style:solid;background:color-mix(in srgb,var(--green) 45%,#fff);border-color:transparent}
.pill.need{background:var(--bg);border:2px solid var(--orange)}
.pill.chk{background:var(--yellow);border-color:var(--yellow)}
.frow.old .fname,.doc-files li.old .fname{text-decoration:line-through;color:var(--muted)}
.rowact{margin-top:6px;min-height:32px;padding:0 12px;font-size:14px}
.pill svg{width:11px;height:11px}
.pills .cnt{font-size:13px;color:var(--muted);margin-inline-start:6px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;border-radius:999px;padding:3px 12px;white-space:nowrap}
.st-prog{background:var(--blue)}
.st-wait{background:var(--yellow)}
.st-ok{border:1.5px solid var(--green);padding:1.5px 10.5px}
.st-ok::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--green)}
.late{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;margin-top:4px}
.late::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--orange)}
.fold{font-size:13px;color:var(--muted)}
.fold.full{color:var(--ink);font-weight:600}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
@media (max-width:900px){
  .lrow{grid-template-columns:1fr auto;grid-template-areas:"n s" "r d" "p f"}
  .lrow.head{display:none}
  .c-n{grid-area:n}.c-s{grid-area:s;justify-self:end}.c-r{grid-area:r}.c-d{grid-area:d;justify-self:end}.c-p{grid-area:p}.c-f{grid-area:f;justify-self:end}
}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:40;animation:fade .15s var(--ease)}
.drawer{position:fixed;inset-block:0;inset-inline-end:0;width:min(560px,100%);background:var(--bg);z-index:41;overflow:auto;box-shadow:0 0 0 1px var(--line);animation:slide .2s var(--ease);display:flex;flex-direction:column}
@keyframes fade{from{opacity:0}}
@keyframes slide{from{transform:translateX(-24px);opacity:0}}
.dr-top{position:sticky;top:0;background:var(--bg);padding:12px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;z-index:2}
.dr-body{padding:18px 20px 24px;flex:1}
.dr-body h1{font-size:24px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;font-size:15px;margin:10px 0 18px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:500;min-width:0;overflow-wrap:anywhere}
.sec-title{font-size:15px;font-weight:700;margin:20px 0 8px;color:var(--muted)}
.dlist{border:1px solid var(--line);border-radius:10px}
.ditem{padding:12px 14px;border-top:1px solid var(--line)}
.ditem:first-child{border-top:0}
.ditem .dh{display:flex;align-items:center;gap:8px;font-weight:700}
.ditem .dh .miss{margin-inline-start:auto;font-size:13px;color:var(--muted);font-weight:600}
.ditem .dh .miss.r{color:var(--orange)}
.sw{display:flex;align-items:center;gap:8px;margin-inline-start:auto}
.sw-o{background:none;border:0;padding:4px 2px;cursor:pointer;font-size:14px;font-weight:500;color:var(--muted)}
.sw-o[aria-checked=true]{font-weight:800;color:var(--ink)}
.sw-t{position:relative;width:52px;height:28px;border-radius:999px;border:0;background:var(--line);cursor:pointer;flex:none;transition:background-color .15s var(--ease)}
.sw-t::after{content:"";position:absolute;top:4px;right:16px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:right .15s var(--ease)}
.sw-t.ok{background:var(--green)} .sw-t.ok::after{right:4px}
.sw-t.replace{background:var(--orange)} .sw-t.replace::after{right:28px}
.doc.need{border-style:solid;border-color:var(--orange)}
.st-rep{color:var(--ink);font-weight:800;border:2px solid var(--orange);border-radius:999px;padding:1px 10px}
.frow{display:flex;align-items:center;gap:10px;font-size:14px;margin-top:6px;flex-wrap:wrap}
.frow .fname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px}
.frow .in{font-size:13px;font-weight:600}
.frow .new{font-size:13px;font-weight:700;background:var(--yellow);padding:0 8px;border-radius:999px}
.frow .x{margin-inline-start:auto;display:flex;gap:12px}
.hist{font-size:13px;color:var(--muted);margin-top:18px;line-height:1.9}
.dr-actions{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:14px 20px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.dr-actions .why{font-size:14px;color:var(--muted);flex-basis:100%}
.danger{margin-top:28px;text-align:center}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px;background:rgba(0,0,0,.32);animation:fade .15s var(--ease)}
.mbox{background:var(--bg);border-radius:14px;max-width:520px;width:100%;padding:22px;max-height:90vh;overflow:auto}
.mbox h2{font-size:20px}
.mbox p{color:var(--muted);margin:0 0 14px}
.mbtns{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.textarea{min-height:170px;resize:vertical;line-height:1.6}
.pick{display:flex;flex-direction:column;gap:8px}

/* ---------- login ---------- */
.login{max-width:400px;margin:40px auto;padding:0 16px}
.pw{position:relative}
.pw input{padding-right:46px;padding-left:12px}   /* LTR text starts left, so the eye sits right and never covers it */
.pw .eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;cursor:pointer;width:36px;height:36px;display:grid;place-items:center;color:var(--muted)}

/* ---------- toast ---------- */
#toast{position:fixed;bottom:22px;inset-inline:0;display:flex;justify-content:center;pointer-events:none;z-index:80}
#toast .t{background:var(--ink);color:#fff;border-radius:10px;padding:12px 18px;font-weight:600;max-width:min(560px,92vw);box-shadow:0 4px 18px rgba(0,0,0,.18);animation:fade .15s var(--ease)}
.loading{padding:60px 16px;text-align:center;color:var(--muted)}
.foot{margin-top:28px;font-size:14px;color:var(--muted);text-align:center}
</style>

<script>
'use strict';
/* =====================================================================
   Constants
   ===================================================================== */
const CFG = window.SHAVIM_CONFIG;
const DEMO = !CFG.apiUrl;
const DOCS = [
  {key:'committee',   label:'טופס החלטת ועדה',              req:true},
  {key:'psychiatric', label:'דוח פסיכיאטרי עדכני',           req:true},
  {key:'social',      label:'דוח סוציאלי / פסיכוסוציאלי',    req:true},
  {key:'medical',     label:'סיכום מידע רפואי מרופא משפחה', req:false},
  {key:'idcard',      label:'צילום ת"ז',                     req:false},
];
const DOC = Object.fromEntries(DOCS.map(d => [d.key, d]));
const REQUIRED = DOCS.filter(d => d.req).map(d => d.key);
const STATUS = {
  in_progress:{label:'בתהליך', cls:'st-prog'},
  submitted:  {label:'ממתין לאישור', cls:'st-wait'},
  approved:   {label:'אושר', cls:'st-ok'},
};
const OVERDUE_DAYS = 7, PURGE_DAYS = 14, MAX_MB = 15;
const EXT_MIME = {pdf:'application/pdf',jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',webp:'image/webp',heic:'image/heic',heif:'image/heif',
  doc:'application/msword',docx:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'};
const ACCEPT = '.pdf,.jpg,.jpeg,.png,.webp,.heic,.heif,.doc,.docx,image/*,application/pdf';
const BASE_URL = location.protocol === 'file:' ? location.href.split(/[?#]/)[0]
  : (CFG.publicUrl || (location.origin + location.pathname)).replace(/index\.html$/,'');
const ICON_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const ICON_EYE = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';

/* =====================================================================
   Small helpers
   ===================================================================== */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const fmtDate = iso => { if (!iso) return '—'; const d = new Date(iso); return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`; };
const dotDate = (d = new Date()) => `${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()}`;
const daysSince = iso => Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
const fmtSize = b => !b ? '' : b < 1024*1024 ? Math.max(1, Math.round(b/1024)) + 'KB' : (b/1024/1024).toFixed(1) + 'MB';
const extOf = name => (String(name).toLowerCase().match(/\.([a-z0-9]+)$/) || [,''])[1];

function normPhone(v) {
  let d = String(v || '').replace(/[^\d+]/g, '');
  if (d.startsWith('+972')) d = '0' + d.slice(4);
  else if (d.startsWith('00972')) d = '0' + d.slice(5);
  else if (d.startsWith('972')) d = '0' + d.slice(3);
  d = d.replace(/\D/g, '');
  if (/^5\d{8}$/.test(d)) d = '0' + d;
  return d;
}
const phoneOk = v => /^05\d{8}$/.test(normPhone(v));
const fmtPhone = v => { const d = normPhone(v); return d.slice(0,3) + '-' + d.slice(3); };
const waPhone = v => '972' + normPhone(v).slice(1);
const normEmail = v => String(v || '').trim().toLowerCase();
const emailOk = v => /^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(normEmail(v));
const TYPOS = {'gmial.com':'gmail.com','gmal.com':'gmail.com','gmai.com':'gmail.com','gamil.com':'gmail.com','gmail.co':'gmail.com','gmail.co.il':'gmail.com',

function normTz(v) { const d = String(v || '').replace(/\D/g, ''); return d.length >= 5 && d.length <= 9 ? d.padStart(9, '0') : d; }
function tzOk(v) {
  const d = normTz(v); if (!/^\d{9}$/.test(d)) return false;
  let s = 0; for (let i = 0; i < 9; i++) { let n = +d[i] * (i % 2 + 1); s += n > 9 ? n - 9 : n; }

}

/* =====================================================================
   IndexedDB (folder handle + demo files)
   ===================================================================== */
const idb = {
  _db: null,
  open() {
    if (this._db) return Promise.resolve(this._db);
    return new Promise((res, rej) => {
      const q = indexedDB.open('shavim-intake', 1);
      q.onupgradeneeded = () => { q.result.createObjectStore('kv'); q.result.createObjectStore('blobs'); };
      q.onsuccess = () => res(this._db = q.result); q.onerror = () => rej(q.error);
    });
  },
  async get(store, key) { const db = await this.open(); return new Promise((res, rej) => { const q = db.transaction(store).objectStore(store).get(key); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); },
  async set(store, key, val) { const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction(store, 'readwrite'); t.objectStore(store).put(val, key); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); },
  async del(store, key) { const db = await this.open(); return new Promise((res) => { const t = db.transaction(store, 'readwrite'); t.objectStore(store).delete(key); t.oncomplete = () => res(); }); },
};

async function sendEmail({to, subject, html, replyTo}) {
  const ej = CFG.emailjs || {};

    console.info('[email skipped – not configured]', {to, subject});
    if (DEMO) { toast(`(הדגמה) מייל אל ${to} לא נשלח באמת`); return true; }
    return false;
  }
  try {
    const res = await fetch('https://api.emailjs.com/api/v1.0/email/send', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({service_id: ej.serviceId, template_id: ej.templateId, user_id: ej.publicKey,
        template_params: {to_email: to, subject, message_html: html, reply_to: replyTo || CFG.noaEmail}})

    return true;

const fileMime = f => f.type || EXT_MIME[extOf(f.name)] || 'application/octet-stream';

const safeExt = f => EXT_MIME[extOf(f.name)] ? extOf(f.name) : (Object.keys(EXT_MIME).find(k => EXT_MIME[k] === f.type) || 'bin');

const STAFF_KEY = 'shavim-staff-session';
const staffToken = {
  get() { try { return localStorage.getItem(STAFF_KEY); } catch { return null; } },
  set(t) { try { t ? localStorage.setItem(STAFF_KEY, t) : localStorage.removeItem(STAFF_KEY); } catch {} },
};
async function call(path, {method = 'GET', json, body, staff = false, raw = false} = {}) {
  const headers = {};
  if (json !== undefined) headers['Content-Type'] = 'application/json';
  if (staff && staffToken.get()) headers.Authorization = 'Bearer ' + staffToken.get();
  const res = await fetch(CFG.apiUrl.replace(/\/+$/, '') + path, {method, headers, body: json !== undefined ? JSON.stringify(json) : body});
  if (!res.ok) {
    const err = new Error((await res.json().catch(() => ({}))).error || 'http_' + res.status); err.status = res.status;
    if (staff && res.status === 401) staffToken.set(null);
    throw err;
  }
  return raw ? res.blob() : res.json();
}
const LiveAPI = {

  upload(token, doc, file, replace) {
    const fd = new FormData(); fd.append('doc_type', doc); fd.append('file', file, uploadName(file)); if (replace) fd.append('replace', '1');
    return call(`/api/intake/${token}/files`, {method:'POST', body: fd});

/* ---- demo backend: localStorage + IndexedDB ---- */
const DEMO_KEY = 'shavim-demo-v1';
const Demo = {
  load() { try { return JSON.parse(localStorage.getItem(DEMO_KEY)) || null; } catch { return null; } },
  store(db) { try { localStorage.setItem(DEMO_KEY, JSON.stringify(db)); } catch {} },
  db() { let d = this.load(); if (!d) { d = seedDemo(); this.store(d); } return d; },
  pub(r) { return {token:r.token, participant_name:r.participant_name, participant_id:r.participant_id, ref_name:r.ref_name, ref_email:r.ref_email, ref_phone:r.ref_phone, status:r.status, created_at:r.created_at, reviews:{...(r.reviews || {})},
    files:r.files.map(f => ({id:f.id, doc_type:f.doc_type, original_name:f.original_name, size_bytes:f.size_bytes, uploaded_at:f.uploaded_at, locked:!!f.downloaded_at, replaced:!!f.replaced_at}))}; },
  find(db, token) { const r = db.requests.find(x => x.token === token); if (!r) throw new Error('not_found'); return r; },
  open(db, token) { const r = this.find(db, token); if (r.status === 'approved') throw new Error('not_found_or_closed'); return r; },
};
const DemoAPI = {
  async get(token) { const r = Demo.find(Demo.db(), token); return r.status === 'approved' ? {status:'approved'} : Demo.pub(r); },
  async save(token, p) {
    // same rules as intake_save: a new form never reopens an existing request; same ID → both flagged
    const db = Demo.db(); let r; const now = new Date().toISOString();
    if (!token) {
      const same = db.requests.filter(x => x.participant_id === p.participant_id);
      same.forEach(x => x.possible_duplicate = true);
      r = {id:uid(), token:uid(), status:'in_progress', created_at:now, files:[], possible_duplicate: same.length > 0}; db.requests.unshift(r);
    } else r = Demo.open(db, token);
    Object.assign(r, p, {updated_at: now}); Demo.store(db);
    return {...Demo.pub(r), merged:false};
  },
  async upload(token, doc, file, replace) {
    const db = Demo.db(); const r = Demo.open(db, token); const id = uid();
    await idb.set('blobs', id, file);
    const prev = (r.reviews || {})[doc], t = new Date().toISOString();
    if (replace || prev === 'replace') r.files.forEach(f => { if (f.doc_type === doc && !f.replaced_at) f.replaced_at = t; });
    if (prev) r.reviews[doc] = 'check';   // Noa had reviewed it: the new file waits for her check
    r.files.push({id, doc_type:doc, original_name:file.name, size_bytes:file.size, mime:fileMime(file), uploaded_at:t, downloaded_at:null, storage_path:id});
    r.fully_downloaded_at = null; r.updated_at = new Date().toISOString(); Demo.store(db); return Demo.pub(r);
  },
  async remove(token, fileId) {
    const db = Demo.db(); const r = Demo.open(db, token); const f = r.files.find(x => x.id === fileId && !x.downloaded_at);
    if (f) { r.files = r.files.filter(x => x !== f); if (r.reviews) delete r.reviews[f.doc_type]; }
    Demo.store(db); return Demo.pub(r);
  },
  async submit(token) {
    const db = Demo.db(); const r = Demo.open(db, token);
    if (missingReq(r).length) throw new Error('missing_required');
    r.status = 'submitted'; r.submitted_at = r.submitted_at || new Date().toISOString(); Demo.store(db); return Demo.pub(r);
  },
  async session() { try { return sessionStorage.getItem('shavim-demo-login') ? {email: CFG.noaEmail} : null; } catch { return null; } },
  async login() { try { sessionStorage.setItem('shavim-demo-login', '1'); } catch {} },
  async logout() { try { sessionStorage.removeItem('shavim-demo-login'); } catch {} },
  async changePassword(current, next) { if (next.length < 8) { const e = new Error('too_short'); e.status = 400; throw e; } return {ok:true}; },
  async list() { return structuredClone(Demo.db().requests); },
  async update(id, patch) { const db = Demo.db(); Object.assign(db.requests.find(r => r.id === id), patch); Demo.store(db); },
  async review(id, doc, state) {   // same rule as the Worker: all required 'ok' → approved
    const db = Demo.db(); const r = db.requests.find(x => x.id === id); r.reviews = r.reviews || {};
    if (state) r.reviews[doc] = state; else delete r.reviews[doc];
    const approved = REQUIRED.every(k => r.reviews[k] === 'ok');
    if (approved) { const t = new Date().toISOString(); Object.assign(r, {status:'approved', approved_at:t, submitted_at:r.submitted_at || t}); }
    Demo.store(db); return {ok:true, approved, reviews:{...r.reviews}};
  },
  async markFiles(ids, patch) { const db = Demo.db(); db.requests.forEach(r => r.files.forEach(f => { if (ids.includes(f.id)) Object.assign(f, patch); })); Demo.store(db); },
  async blob(f) { return (await idb.get('blobs', f.id)) || demoPdf(f.original_name); },
  async viewUrl(f) { return URL.createObjectURL(await this.blob(f)); },
  async purge(r) { for (const f of r.files) await idb.del('blobs', f.id); },
  async destroy(r) { await this.purge(r); const db = Demo.db(); db.requests = db.requests.filter(x => x.id !== r.id); Demo.store(db); },
};

// Keep Tab / Shift+Tab inside an open dialog
function trapTab(e, box) {
  if (e.key !== 'Tab') return;
  const items = $$('button:not(:disabled), a[href], input:not([tabindex="-1"]), textarea, [tabindex="0"]', box).filter(x => x.offsetParent !== null);
  if (!items.length) return;
  const first = items[0], last = items[items.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
}
// onClose runs once, however the dialog closes (button, Esc, click outside)
function modal(html, onMount, onClose) {
  const layer = $('#layer'); const prev = document.activeElement;
  const el = document.createElement('div'); el.className = 'modal'; el.setAttribute('role','dialog'); el.setAttribute('aria-modal','true');
  el.innerHTML = `<div class="mbox">${html}</div>`;
  const h = el.querySelector('h2'); if (h) { h.id = 'mh-' + uid(); el.setAttribute('aria-labelledby', h.id); }
  layer.appendChild(el);
  let closed = false;
  const close = () => { if (closed) return; closed = true; el.remove(); document.removeEventListener('keydown', onKey); prev && prev.focus && prev.focus(); onClose && onClose(); };
  const onKey = e => { if (e.key === 'Escape') close(); else trapTab(e, el); };
  document.addEventListener('keydown', onKey);
  el.addEventListener('click', e => { if (e.target === el || e.target.closest('[data-close]')) close(); });
  onMount && onMount(el, close);
  const first = el.querySelector('[autofocus], button, textarea, input'); first && first.focus();
  return close;
}
function ask(title, text, buttons) {
  return new Promise(res => {
    let value = null;
    modal(`<h2>${esc(title)}</h2>${text ? `<p>${text}</p>` : ''}<div class="mbtns">${buttons.map((b,i) =>
      `<button class="btn ${b.primary ? 'primary' : b.ghost ? 'ghost' : ''}" data-i="${i}">${esc(b.label)}</button>`).join('')}</div>`,
      (el, close) => el.querySelectorAll('[data-i]').forEach(b => b.onclick = () => { value = buttons[+b.dataset.i].value; close(); }),
      () => res(value));
  });
}

            <span class="sub">${fmtSize(f.size_bytes)} · ${fmtDate(f.uploaded_at)}</span>
            ${isOld(f) ? '<span class="sub">הוחלף</span>' : rv[d.key] === 'check' && !f.downloaded_at ? '<span class="new">חדש — לבדיקה</span>'
              : f.downloaded_at ? '<span class="in">בתיקייה ✓</span>' : '<span class="new">חדש</span>'}
            ${purged ? '' : `<span class="x"><button class="linkbtn" data-view="${f.id}">צפייה</button>${isOld(f) ? '' : `<button class="linkbtn" data-dlf="${f.id}">הורדה</button>`}</span>`}</div>`).join('')}</div>`; }).join('')}</div>
      <div class="hist">${hist}</div>
      <div class="danger"><button class="linkbtn" id="del">מחיקת הבקשה</button></div>
    </div>
    ${primary || dl || arch ? `<div class="dr-actions">${primary}${dl}${arch}${why ? `<span class="why">${why}</span>` : ''}</div>` : ''}`;
  dr.querySelector('#back').onclick = closeDrawer;
  dr.querySelectorAll('[data-view]').forEach(b => b.onclick = async () => {
    const f = fs.find(x => x.id === b.dataset.view); const w = window.open('', '_blank');
    try { const url = await API.viewUrl(f); if (w) w.location = url; else window.open(url, '_blank'); }
    catch { w && w.close(); toast('לא הצלחנו לפתוח את הקובץ'); }
  });
  dr.querySelectorAll('[data-rv]').forEach(b => b.onclick = () => doReview(r, b));
  const on = (id, fn) => { const b = dr.querySelector('#' + id); if (b) b.onclick = e => fn(r, e.currentTarget); };
  on('approve', doApprove); on('remind', doRemind); on('thanks', doThanks); on('dl', doDownload); on('del', doDelete); on('arch', doArchive);
  dr.querySelectorAll('[data-dlf]').forEach(b => b.onclick = () => doDownload(r, b, b.dataset.dlf));   // one file
}
async function refresh(r) {
  await loadDash(true);
  D.openId = r.id;
  const nr = D.list.find(x => x.id === r.id);
  if (nr && $('.drawer')) fillDrawer(nr); else if (nr) openDrawer(nr.id);
  return nr;
}

/* ---------- messages Noa sends herself ---------- */
function reminderText(r, wa) {
  const b = s => wa ? `*${s}*` : s; const miss = missingReq(r), rep = toReplace(r);
  const parts = [];
  if (miss.length) parts.push(`עדיין חסרים מסמכי הקליטה של ${b(r.participant_name)}:\n${miss.map(k => '• ' + DOC[k].label).join('\n')}`);
  if (rep.length) parts.push(`${miss.length ? 'וגם צריך' : `צריך`} להחליף מסמכים של ${b(r.participant_name)}:\n${rep.map(k => '• ' + DOC[k].label).join('\n')}`);
  return `שלום ${r.ref_name},\nבקשה לעדכון מסמכים מ${b('עמותת שווים')}: ${parts.join('\n')}\n\nאפשר להשלים כאן, באותו לינק:\n${contLink(r)}\n\nתודה,\n${SIGN.join('\n')}`;
}
function thanksText(r) {
  return `שלום ${r.ref_name},\nתודה רבה, כל מסמכי הקליטה של ${r.participant_name} התקבלו.\nנשמח להמשיך לשתף פעולה גם בהמשך.\n\n${SIGN.join('\n')}`;
}
// Opens the draft in WhatsApp / mail; the date is recorded only after Noa confirms she sent it
function composeAndSend(r, {title, subject, textFor, stamp}) {
  return new Promise(resolve => {
    let via = null;
    modal(`<h2>${esc(title)}</h2><p>אפשר לערוך את ההודעה לפני השליחה. היא תיפתח אצלך, ואת לוחצת "שלח".</p>
      <label class="sr" for="msg">ההודעה</label><textarea class="textarea" id="msg" style="width:100%"></textarea>
      <div class="mbtns"><button class="btn primary" id="viaWa">שליחה ב-WhatsApp</button><button class="btn" id="viaMail">שליחה במייל</button>
      <button class="btn ghost" data-close>ביטול</button></div>`, (el, close) => {
        const ta = el.querySelector('#msg'); ta.value = textFor(r, true);
        const go = v => {
          const txt = ta.value; via = v;
          if (v === 'wa') window.open(`https://wa.me/${waPhone(r.ref_phone)}?text=${encodeURIComponent(txt)}`, '_blank', 'noopener');
          else location.href = `mailto:${encodeURIComponent(r.ref_email)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(txt.replace(/\*/g, ''))}`;
          close();
        };
        el.querySelector('#viaWa').onclick = () => go('wa');
        el.querySelector('#viaMail').onclick = () => go('mail');
      }, async () => {
        if (!via) return resolve(false);
        const sent = await ask('ההודעה נשלחה?', `לחצת "שלח" ב${via === 'wa' ? '-WhatsApp' : 'מייל'}? נרשום את התאריך בבקשה.`,
          [{label:'כן, נשלחה', value:true, primary:true}, {label:'עוד לא', value:false, ghost:true}]);
        if (!sent) return resolve(false);
        try { await API.update(r.id, {[stamp]: new Date().toISOString()}); resolve(true); }
        catch { toast('התאריך לא נשמר. נסי שוב.'); resolve(false); }
      });
  });
}
async function doRemind(r) {
  const sent = await composeAndSend(r, {title:`בקשה לעדכון ל${r.ref_name}`, subject:`בקשה לעדכון: מסמכי הקליטה של ${r.participant_name} – עמותת שווים`, textFor:reminderText, stamp:'last_reminder_at'});
  if (sent) { if ($('.drawer')) await refresh(r); else await loadDash(true); toast(`הבקשה לעדכון ל${r.ref_name} נרשמה`); }
}
async function doThanks(r) {
  const sent = await composeAndSend(r, {title:`הודעת תודה ל${r.ref_name}`, subject:`מסמכי הקליטה של ${r.participant_name} התקבלו – עמותת שווים`, textFor:thanksText, stamp:'thanks_sent_at'});
  if (sent) { await refresh(r); toast(`הודעת התודה ל${r.ref_name} נרשמה`); }
}
async function doApprove(r, btn) {
  busy(btn, true);
  try { await API.update(r.id, {status:'approved', approved_at:new Date().toISOString()}); }
  catch { busy(btn, false); return toast('האישור לא נשמר. נסי שוב.'); }
  afterApproved(r);
}
async function afterApproved(r) {
  D.flashId = r.id; const nr = await refresh(r);
  toast(`הבקשה של ${r.participant_name} אושרה`);
  const go = await ask('לשלוח תודה לגורם המפנה?', `"תודה רבה, כל מסמכי הקליטה של ${esc(r.participant_name)} התקבלו."`,
    [{label:'כן, לשלוח', value:true, primary:true}, {label:'לא עכשיו', value:false, ghost:true}]);
  if (go) doThanks(nr || r);
}
// Noa's check of one document. Clicking the selected button again clears it.
async function doReview(r, btn) {
  const doc = btn.dataset.rv, state = btn.dataset.st;   // the switch: one side תקין, the other נדרש להחליף
  busy(btn, true);
  let res;
  try { res = await API.review(r.id, doc, state); }
  catch { busy(btn, false); return toast('הסימון לא נשמר. נסי שוב.'); }
  if (res.approved) return afterApproved(r);
  await refresh(r);
}
async function doArchive(r, btn) {
  const out = !r.archived_at; busy(btn, true);
  try { await API.update(r.id, {archived_at: out ? new Date().toISOString() : null}); }
  catch { busy(btn, false); return toast('לא הצלחנו לעדכן. נסי שוב.'); }
  closeDrawer(); await loadDash(true);
  toast(out ? `הבקשה של ${r.participant_name} הועברה לארכיון` : `הבקשה של ${r.participant_name} חזרה לרשימה`);
}
async function doDelete(r) {
  const ok = await ask('למחוק את הבקשה?', `הבקשה של ${esc(r.participant_name)} והקבצים שלה יימחקו מהמערכת. קבצים שכבר הורדו לתיקייה נשארים במחשב. אי אפשר לבטל.`,
    [{label:'מחיקה', value:true}, {label:'ביטול', value:false, ghost:true}]);
  if (!ok) return;
  try { await API.destroy(r); closeDrawer(); await loadDash(true); toast('הבקשה נמחקה'); }
  catch { toast('המחיקה לא הצליחה. נסי שוב.'); }
}

/* =====================================================================
   Download to the network folder (File System Access API)
   ===================================================================== */
// Noa picks the folder on every download; the picker opens on the folder she chose last time
async function getRoot() {
  const last = await idb.get('kv', 'root').catch(() => null);
  try {
    const h = await window.showDirectoryPicker({id:'shavim-intake', mode:'readwrite', ...(last ? {startIn: last} : {})});
    await idb.set('kv', 'root', h).catch(() => {});
    return h;
  } catch (e) { if (e.name !== 'AbortError') toast('לא הצלחנו לפתוח את התיקייה. נסי שוב.'); return null; }
}
// The participant's existing folder is reused; otherwise "<name> - DD.MM.YYYY"
async function findFolder(root, r) {
  if (r.folder_name) { try { return await root.getDirectoryHandle(r.folder_name); } catch {} }
  const base = safeName(r.participant_name);
  for await (const [name, h] of root.entries()) if (h.kind === 'directory' && (name === base || name.startsWith(base + ' - '))) return h;
  return root.getDirectoryHandle(`${base} - ${dotDate()}`, {create:true});
}
// "<document> - <participant>.pdf"; a second file of the same document gets " (2)". Same name → overwritten.
function fileStem(r, f) {
  const same = (r.files || []).filter(x => x.doc_type === f.doc_type && !isOld(x)).sort((a, b) => String(a.uploaded_at).localeCompare(String(b.uploaded_at)));
  const n = same.findIndex(x => x.id === f.id) + 1;
  return safeName(`${DOC[f.doc_type].label} - ${r.participant_name}`) + (n > 1 ? ` (${n})` : '');
}
// All files not yet in the folder, or one file (onlyId) — also one that was already downloaded
async function doDownload(r, btn, onlyId) {
  if (!('showDirectoryPicker' in window)) return ask('צריך Chrome או Edge', 'ההורדה לתיקייה ברשת עובדת רק בדפדפן Chrome או Edge במחשב.', [{label:'הבנתי', value:true}]);
  const root = await getRoot(); if (!root) return;
  let dir; try { dir = await findFolder(root, r); } catch (e) { console.error(e); return toast('לא הצלחנו לכתוב בתיקייה הזו. נסי תיקייה אחרת.'); }
  const pending = (r.files || []).filter(f => onlyId ? f.id === onlyId : !f.downloaded_at && !isOld(f));
  busy(btn, true); const done = [];
  try {
    for (let i = 0; i < pending.length; i++) {
      const f = pending[i]; btn.textContent = `שומר ${i+1} מתוך ${pending.length}…`;
      const blob = await API.blob(f);
      // extension from the stored file (checked by the server), never trusted from the uploaded name
      const ext = [extOf(f.storage_path), extOf(f.original_name)].find(x => EXT_MIME[x]) || 'pdf';
      const fh = await dir.getFileHandle(`${fileStem(r, f)}.${ext}`, {create:true});
      const w = await fh.createWritable(); await w.write(blob); await w.close();
      done.push(f.id);
    }
  } catch (e) { console.error(e); toast(`נשמרו ${done.length} מתוך ${pending.length}. הקבצים האחרים לא נשמרו — נסי שוב.`, 5000); }
  if (done.length) {
    const now = new Date().toISOString(), all = (r.files || []).every(f => isOld(f) || f.downloaded_at || done.includes(f.id));
    const mark = async () => {
      await API.markFiles(done, {downloaded_at: now});
      await API.update(r.id, {folder_name: dir.name, last_download_at: now, fully_downloaded_at: all ? now : null});
    };
    // retry once, so saved files are not downloaded again as duplicates
    try { await mark().catch(mark); if (onlyId) toast(`הקובץ נשמר בתיקייה "${dir.name}"`, 4500); else if (all) toast(`${done.length} קבצים נשמרו בתיקייה "${dir.name}"`, 4500); }
    catch (e) { console.error(e); toast(`הקבצים נשמרו בתיקייה "${dir.name}", אבל לא הצלחנו לסמן אותם במערכת. רענני את הדף לפני הורדה נוספת.`, 7000); }
  }
  try { await refresh(r); } catch (e) { console.error(e); busy(btn, false); }
}

/* =====================================================================
   Router
   ===================================================================== */
(function route() {
  const p = new URLSearchParams(location.search);
  if (p.has('noa')) { document.title = 'שווים · דשבורד קליטה'; startNoa(); }
  else startForm(p.get('r'));
})();
</script>
